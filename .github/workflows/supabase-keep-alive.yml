name: Supabase Keep Alive

on:
  schedule:
    # Runs at 00:00 UTC every 3 days
    # (Supabase free tier pauses projects after 1 week of inactivity)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          # Name the missing secret instead of failing with a bare curl error
          [ -n "$SUPABASE_URL" ] || { echo "::error::Repository secret SUPABASE_URL is not set"; exit 1; }
          [ -n "$SUPABASE_KEY" ] || { echo "::error::Repository secret SUPABASE_KEY is not set"; exit 1; }
          # --fail-with-body: a 401/404 fails the job instead of passing silently
          curl --fail-with-body -sS "$SUPABASE_URL/rest/v1/companies?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY"
